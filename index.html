<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atsushi's PC</title>
  <link rel="stylesheet" href="css/win98.css">
  <link rel="stylesheet" href="css/ie-base.css">
  <link rel="stylesheet" href="css/ie-home.css">
  <link rel="stylesheet" href="css/ie-about.css">
  <link rel="stylesheet" href="css/ie-thoughts.css">
  <link rel="stylesheet" href="css/ie-projects.css">
  <link rel="stylesheet" href="css/ie-guestbook.css">
  <link rel="stylesheet" href="css/boot.css">
  <script defer src="https://cloud.umami.is/script.js"
    data-website-id="d26f2f30-ead0-4092-b7c5-99afac8eda72"></script>
</head>
<body>

  <!-- Gate screen: Matrix rain + Click to Start prompt -->
  <div id="gate-screen" aria-label="System startup screen">
    <canvas id="matrix-canvas" aria-hidden="true"></canvas>
    <div id="gate-prompt"
         role="button"
         tabindex="0"
         aria-label="Click or press any key to start Atsushi's PC">
      <p id="gate-label">Click to Start</p>
      <p id="gate-terminal">C:\&gt; press any key to continue<span
        id="gate-cursor"
        aria-hidden="true">█</span></p>
    </div>
  </div>

  <!-- Win98 boot screen: navy background, logo text, progress bar -->
  <div id="boot-screen" class="boot-screen--hidden"
       role="status" aria-label="Loading Windows 98" aria-live="polite">
    <p id="boot-logo-text" aria-hidden="true">Windows 98</p>
    <div id="boot-progress-track"
         role="progressbar"
         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
         aria-label="Windows 98 loading progress"></div>
  </div>

  <!-- Desktop shell — shown after boot sequence completes -->
  <div id="desktop" class="desktop--hidden">

    <!-- Desktop icons -->
    <div id="desktop-icons" aria-label="Desktop">
      <div class="desktop-icon" data-app="my-computer"
           tabindex="0" role="button" aria-label="My Computer">
        <span class="desktop-icon__img" aria-hidden="true">🖥</span>
        <span class="desktop-icon__label">My Computer</span>
      </div>
      <div class="desktop-icon" data-app="ie"
           tabindex="0" role="button" aria-label="Internet Explorer">
        <span class="desktop-icon__img" aria-hidden="true">🌐</span>
        <span class="desktop-icon__label">Internet Explorer</span>
      </div>
      <div class="desktop-icon" data-app="resume-exe"
           tabindex="0" role="button" aria-label="resume_FINAL_v3.exe">
        <span class="desktop-icon__img" aria-hidden="true">💾</span>
        <span class="desktop-icon__label">resume_FINAL_v3.exe</span>
      </div>
    </div>

    <!-- Window layer — windows are appended here by desktop.js -->
    <div id="window-layer"></div>

    <!-- Start menu stub — toggled by start button -->
    <div id="start-menu" aria-label="Start menu" role="menu">
      <p class="start-menu__stub">Start menu coming soon</p>
    </div>

    <!-- Taskbar: start button (float left), system tray (float right),
         taskbar-windows fills remaining width via BFC (overflow:hidden) -->
    <div id="taskbar" role="toolbar" aria-label="Taskbar">
      <button id="start-button" aria-haspopup="true" aria-expanded="false">
        Start
      </button>
      <div id="system-tray" aria-label="System tray">
        <span id="taskbar-clock" aria-live="polite" aria-label="System clock"></span>
      </div>
      <div id="taskbar-windows" role="group" aria-label="Open windows"></div>
    </div>

  </div>

  <script src="js/desktop.js"></script>
  <script src="js/ie.js"></script>
  <script src="js/boot.js"></script>
  <script>
    window.APC.boot.init();
  </script>

</body>
</html>
